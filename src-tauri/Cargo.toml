[package]
name = "nfl-watch"
version = "0.3.0"
license = "MIT"
repository = "https://github.com/iso8859-1/nfl-watch"
description = "Spoiler-free NFL game recommendations"
authors = ["Tobias Langner"]
edition = "2021"

[lib]
name = "nfl_watch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
chrono = "0.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
